name: Build, smoke test, and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate localization keys
        shell: pwsh
        run: |
          $text = Get-Content "EldenBingoCommon\LocalizationManager.cs" -Raw
          $matches = [regex]::Matches(
            $text,
            '\{\s*"(?<key>(?:[^"\\]|\\.)*)"\s*,\s*"(?<value>(?:[^"\\]|\\.)*)"\s*\}'
          )

          $duplicates = $matches |
            ForEach-Object { $_.Groups["key"].Value } |
            Group-Object -CaseSensitive:$false |
            Where-Object Count -gt 1

          if ($duplicates) {
            $names = ($duplicates | ForEach-Object Name) -join ", "
            throw "Duplicate localization keys found: $names"
          }

          Write-Host "Localization keys are unique."

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EldenBingo.sln

      - name: Build solution
        run: dotnet build EldenBingo.sln -c Release --no-restore

      - name: Publish Windows x64 client
        run: dotnet publish EldenBingo/EldenBingo.csproj -c Release -r win-x64 --self-contained false -o release

      - name: Verify framework-dependent package
        shell: pwsh
        run: |
          $required = @(
            "EldenBingo.exe",
            "EldenBingo.dll",
            "EldenBingo.runtimeconfig.json"
          )

          foreach ($file in $required) {
            $path = Join-Path $PWD "release\$file"
            if (-not (Test-Path $path)) {
              throw "Framework-dependent release is missing required file: $file"
            }
          }

          $bundledRuntimeFiles = @(
            "coreclr.dll",
            "hostfxr.dll",
            "hostpolicy.dll"
          ) | Where-Object { Test-Path (Join-Path $PWD "release\$_") }

          if ($bundledRuntimeFiles.Count -gt 0) {
            throw "Release unexpectedly bundles .NET runtime files: $($bundledRuntimeFiles -join ', ')"
          }

          $desktopRuntime = dotnet --list-runtimes | Select-String '^Microsoft.WindowsDesktop.App 8\.'
          if (-not $desktopRuntime) {
            throw ".NET Desktop Runtime 8 is required for the startup smoke test."
          }

          Write-Host "Framework-dependent package verified."

      - name: Smoke test client startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release\EldenBingo.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable was not found: $exe"
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            throw "EldenBingo.exe exited during startup with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Startup smoke test passed."

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content "EldenBingoCommon\Version.cs" -Raw
          if ($text -notmatch 'CurrentVersion\s*=>\s*"([^"]+)"') {
            throw "Could not read CurrentVersion from EldenBingoCommon/Version.cs"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$version" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: |
          $zip = "EldenBingo_v${{ steps.version.outputs.version }}.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "release\*" -DestinationPath $zip -CompressionLevel Optimal
          $sizeBytes = (Get-Item $zip).Length
          $sizeMiB = [math]::Round($sizeBytes / 1MB, 2)
          Write-Host "Created $zip ($sizeMiB MiB)"

          # awsker/EldenBingo currently ships a ~35.9 MB framework-dependent ZIP.
          # Keep this fork within the same release-size class and fail on accidental runtime bundling/regression.
          $maxSizeMiB = 40
          if ($sizeMiB -gt $maxSizeMiB) {
            throw "Release package is $sizeMiB MiB, above the $maxSizeMiB MiB size budget."
          }

      - name: Publish or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "EldenBingo_v$env:VERSION.zip"
          $notes = @"
          # Patch Notes

          ## Elden Bingo PT-BR v$env:VERSION

          ### Bug Fixes
          - Fixed PT-BR localization startup crashes caused by duplicate case-insensitive dictionary keys.
          - Improved startup crash reporting.
          - Improved release validation for localization keys.

          ### Distribution
          - Restored the upstream awsker/EldenBingo framework-dependent release model to reduce download size.
          - Windows x64.
          - Requires .NET Desktop Runtime 8.
          - One release ZIP: EldenBingo_v$env:VERSION.zip.

          .NET Desktop Runtime 8:
          https://dotnet.microsoft.com/en-us/download/dotnet/8.0
          "@

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:TAG" --title "Elden Bingo v$env:VERSION" --notes "$notes"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to refresh existing release $env:TAG."
            }

            Write-Host "Release $env:TAG already exists; notes refreshed after successful validation."
            exit 0
          }

          gh release create "$env:TAG" "$zip" --target "$env:GITHUB_SHA" --title "Elden Bingo v$env:VERSION" --notes "$notes"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $env:TAG."
          }
