name: Build, smoke test, and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate localization keys
        shell: pwsh
        run: |
          $text = Get-Content "EldenBingoCommon\LocalizationManager.cs" -Raw
          $matches = [regex]::Matches(
            $text,
            '\{\s*"(?<key>(?:[^"\\]|\\.)*)"\s*,\s*"(?<value>(?:[^"\\]|\\.)*)"\s*\}'
          )

          $duplicates = $matches |
            ForEach-Object { $_.Groups["key"].Value } |
            Group-Object -CaseSensitive:$false |
            Where-Object Count -gt 1

          if ($duplicates) {
            $names = ($duplicates | ForEach-Object Name) -join ", "
            throw "Duplicate localization keys found: $names"
          }

          Write-Host "Localization keys are unique."

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EldenBingo.sln

      - name: Build solution
        run: dotnet build EldenBingo.sln -c Release --no-restore

      - name: Publish self-contained Windows x64 client
        run: dotnet publish EldenBingo/EldenBingo.csproj -c Release -r win-x64 --self-contained true -o release

      - name: Verify self-contained runtime
        shell: pwsh
        run: |
          $required = @(
            "EldenBingo.exe",
            "coreclr.dll",
            "hostfxr.dll",
            "hostpolicy.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path $PWD "release\$file"
            if (-not (Test-Path $path)) {
              throw "Self-contained release is missing required runtime file: $file"
            }
          }

          Write-Host "Self-contained runtime files are present."

      - name: Smoke test client startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release\EldenBingo.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable was not found: $exe"
          }

          # Force the smoke test not to use a machine-wide .NET installation.
          $env:DOTNET_ROOT = Join-Path $PWD "no-system-dotnet"
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            throw "EldenBingo.exe exited during startup with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Startup smoke test passed."

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content "EldenBingoCommon\Version.cs" -Raw
          if ($text -notmatch 'CurrentVersion\s*=>\s*"([^"]+)"') {
            throw "Could not read CurrentVersion from EldenBingoCommon/Version.cs"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: |
          $zip = "EldenBingo_v${{ steps.version.outputs.version }}.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "release\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Publish or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "EldenBingo_v$env:VERSION.zip"
          $notes = @"
          ## EldenBingo PT-BR $env:VERSION

          Release de correção da inicialização da localização PT-BR.

          ### Correções
          - Remove a chave duplicada "Bingo Board" do dicionário de localização PT-BR.
          - Remove a colisão case-insensitive "Stop Match" / "Stop match".
          - Estas colisões causavam TypeInitializationException durante a inicialização do LocalizationManager.
          - Adiciona validação automática de chaves duplicadas de localização antes de compilar e publicar.
          - Mantém o pacote Windows x64 self-contained e o diagnóstico de falhas de inicialização.

          ### Inclui também
          - Localização em Português do Brasil.
          - Alternância de idioma entre Inglês e Português do Brasil.
          - Correção de segurança para validação do tamanho de pacotes.

          ### Requisitos
          - Windows x64.

          O pacote foi compilado, verificado como self-contained e submetido a um teste automático de inicialização sem usar uma instalação global do .NET.
          "@

          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:TAG" --title "$env:TAG - EldenBingo PT-BR" --notes "$notes"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to refresh existing release $env:TAG."
            }

            Write-Host "Release $env:TAG already exists; notes refreshed after successful validation."
            exit 0
          }

          gh release create "$env:TAG" "$zip" --target "$env:GITHUB_SHA" --title "$env:TAG - EldenBingo PT-BR" --notes "$notes"
