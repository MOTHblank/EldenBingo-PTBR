name: Delete merged branches

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          delete_branch() {
            local branch="$1"

            if [[ -z "$branch" || "$branch" == "main" ]]; then
              return
            fi

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting merged branch: $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            else
              echo "Branch already absent: $branch"
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
              delete_branch "$HEAD_BRANCH"
            fi
            exit 0
          fi

          # One-time cleanup of merged branches left by the PT-BR release work.
          delete_branch "release-v0.19.0-ci"
          delete_branch "fix-startup-release-v0.19.1"
          delete_branch "fix-localization-duplicate-v0.19.2"
          delete_branch "align-upstream-release-v0.19.3"
          delete_branch "language-toolbar-ptbr-audit-0.19.0.1"
